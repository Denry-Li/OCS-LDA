exp_dir: experiments/3DVar/bohai_forecast_net_era5_5var_40x40_nodown_time2/stage2_ar4
init_checkpoint: experiments/3DVar/bohai_forecast_net_era5_5var_40x40_nodown_time2/stage1_single/checkpoints/best.pt

samples_root: data/samples/yearly_simvp_extent
norm_stats_path: data/stats/norm_stats_train.json

train_years: [2016, 2017, 2018, 2019, 2020, 2021]
valid_years: [2022]
test_years: [2023, 2024]

model_arch: bohai_forecast_net
forecast_lead_steps: 1
forecast_interval_hours: 6
forecast_input_steps: 2
forecast_rollout_steps: 4
rollout_weights: [1.0, 0.5, 0.25, 0.125]

input_vars:
  - era5_u10
  - era5_v10
  - era5_t2m
  - era5_d2m
  - era5_sp

target_vars:
  - era5_u10
  - era5_v10
  - era5_t2m
  - era5_d2m
  - era5_sp

in_chans: 5
out_chans: 5
img_size_x: 40
img_size_y: 40

residual_prediction: true
forecast_downsample_factor: 1
forecast_dim: 64
forecast_bottleneck_dim: 128
forecast_depths: [2, 2, 2]
forecast_heads: [2, 4, 2]
forecast_window_size: 5

use_time_features: true
forecast_time_feature_mode: local_solar
forecast_time_feature_channels: 4

increment_loss_weight: 0.0

optimizer: AdamW
lr: 0.0001
min_lr: 0.000001
weight_decay: 0.0001
batch_size: 16
gradient_accumulation_steps: 4
num_workers: 8
persistent_workers: false
max_epochs: 50
early_stopping_patience: 10
early_stopping_min_delta: 0.000001
enable_amp: true
grad_clip: 1.0
seed: 42
